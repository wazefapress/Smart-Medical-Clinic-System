<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="stylesheet" href="style.css">
    <title>العيادة الطبية - النظام الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between p-4 md:p-6">
<a href="admin.html">تسجيل الدخول</a>
    <div class="max-w-2xl mx-auto w-full bg-white p-6 md:p-8 rounded-xl shadow-lg my-auto">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-700">العيادة الطبية الذكية</h1>
            <p class="text-sm text-gray-500 mt-1">يرجى تعبئة البيانات بدقة لمساعدتنا في تقييم حالتك</p>
            
            <div class="flex justify-center items-center gap-2 mt-4">
                <span id="stepIndicator1" class="px-3 py-1 text-xs font-bold rounded-full bg-emerald-600 text-white transition">1. البيانات الشخصية</span>
                <span class="text-gray-300">←</span>
                <span id="stepIndicator2" class="px-3 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-600 transition">2. الأعراض</span>
            </div>
        </div>

        <form id="medicalForm">
            <!-- الخطوة 1 -->
            <div id="step1" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-sm mb-1">الجنس:</label>
                        <select id="gender" class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-600">
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-sm mb-1">العمر:</label>
                        <input type="number" id="age" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-600" placeholder="مثال: 30">
                    </div>
                </div>
                <div class="flex justify-end mt-6">
                    <button type="button" onclick="nextStep()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-lg transition duration-200">التالي</button>
                </div>
            </div>

            <!-- الخطوة 2 -->
            <div id="step2" class="space-y-4 hidden">
                <div>
                    <label class="block font-semibold text-sm mb-1">الأعراض:</label>
                    <textarea id="symptoms" rows="3" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-600"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-sm mb-1">الشدة:</label>
                    <select id="severity" class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-600">
                        <option value="low">خفيفة</option>
                        <option value="medium">متوسطة</option>
                        <option value="high">شديدة</option>
                    </select>
                </div>
                <div class="flex justify-between mt-6">
                    <button type="button" onclick="prevStep()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2.5 px-6 rounded-lg transition">السابق</button>
                    <button type="submit" id="submitBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-lg transition">إرسال وتحليل</button>
                </div>
            </div>
        </form>

        <div id="resultContainer" class="mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-lg hidden">
            <h3 class="font-bold text-emerald-800 mb-2">تقييم الذكاء الاصطناعي:</h3>
            <p id="aiResponseText" class="text-sm text-emerald-900 leading-relaxed"></p>
        </div>
    </div>

    <script>
        function nextStep() {
            if (!document.getElementById('age').value) return alert('أدخل العمر');
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('stepIndicator1').className = "px-3 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-600";
            document.getElementById('stepIndicator2').className = "px-3 py-1 text-xs font-bold rounded-full bg-emerald-600 text-white";
        }

        function prevStep() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('stepIndicator2').className = "px-3 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-600";
            document.getElementById('stepIndicator1').className = "px-3 py-1 text-xs font-bold rounded-full bg-emerald-600 text-white";
        }

        document.getElementById('medicalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري التحليل...';

            const data = {
                gender: document.getElementById('gender').value,
                age: document.getElementById('age').value,
                symptoms: document.getElementById('symptoms').value,
                severity: document.getElementById('severity').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('aiResponseText').innerText = result.ai_analysis;
                    document.getElementById('resultContainer').classList.remove('hidden');
                }
            } catch (error) {
                alert('خطأ في الاتصال بالخادم.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال وتحليل';
            }
        });
    </script>

            </footer>
</body>
</html>
